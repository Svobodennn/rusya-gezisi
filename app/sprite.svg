    <path class="mt-line" d="M50 3C33 3 22 16 22 33c0 10 3 16 6 21C16 66 9 88 10 112c1 32 17 54 40 54s39-22 40-54c1-24-6-46-18-58 3-5 6-11 6-21C78 16 67 3 50 3z" fill="none"/>
    <path d="M22 92c-2 20 2 40 12 56" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="3" stroke-linecap="round"/>
  </symbol>
