  </symbol>
  <!-- The gold star of the cobalt net, alone: St Petersburg's corner mark. -->
  <symbol id="o-star" viewBox="0 0 24 24"><path d="M12 .8l2.5 8.7 8.7 2.5-8.7 2.5L12 23.2l-2.5-8.7L.8 12l8.7-2.5z" fill="#dcab49"/></symbol>

