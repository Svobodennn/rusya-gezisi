    <path d="M28 56c9 7 35 7 44 0" fill="none" stroke="#dcab49" stroke-width="1.6"/>
    <ellipse class="mt-apron" cx="50" cy="114" rx="27" ry="39"/>
    <ellipse cx="50" cy="114" rx="22.5" ry="34.5" fill="none" stroke="#dcab49" stroke-width="1" stroke-dasharray="2 3"/>
    <path d="M50 114c-9 2-15-2-17-10 8-1 14 3 17 10zM50 114c9 2 15-2 17-10-8-1-14 3-17 10z" fill="#3f7d46"/>
