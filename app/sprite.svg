<svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true" focusable="false">
  <!-- Patterns, ornament symbols and icons. Placed inline at start-up (js/lib/sprite.js) so that url(#…) fills
       and <use href="#…"> can reach them. -->
  <defs>
    <!-- Moscow Kremlin wall: swallowtail merlons with a loophole, standing on a brick parapet. -->
    <pattern id="p-kremlin" width="48" height="56" patternUnits="userSpaceOnUse">
      <path d="M8 40V3l16 13L40 3v37z" fill="#8e2a1f"/>
      <path d="M8 3l16 13L40 3" fill="none" stroke="#c0503f" stroke-width="1.5"/>
      <path d="M8 3v37" stroke="#a63a2c" stroke-width="1.5"/>
      <rect x="21" y="22" width="6" height="12" rx="3" fill="#2a0906"/>
      <rect y="40" width="48" height="16" fill="#761f16"/>
      <path d="M0 40.75h48M0 48h48M24 40v8M12 48v8M36 48v8" stroke="#541209" stroke-width="1"/>
    </pattern>
    <!-- Imperial Porcelain "cobalt net" (Lomonosov factory, Leningrad 1944): cobalt lattice, gold stars at the knots. -->
    <pattern id="p-cobalt" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#f2f5fc"/>
      <path d="M0 0L28 28M28 0L0 28" stroke="#1d3f9e" stroke-width="1.7"/>
      <path d="M14 9.2l1.3 3.5 3.5 1.3-3.5 1.3-1.3 3.5-1.3-3.5-3.5-1.3 3.5-1.3z" fill="#c9962f"/>
      <path d="M0 0l1.3 3.5 3.5 1.3-3.5 1.3L0 9.6M28 0l-1.3 3.5-3.5 1.3 3.5 1.3L28 9.6M0 28l1.3-3.5 3.5-1.3-3.5-1.3L0 18.4M28 28l-1.3-3.5-3.5-1.3 3.5-1.3 1.3-3.5" fill="#c9962f"/>
    </pattern>
    <!-- Cast-iron embankment railing: spear-topped bars, a row of rings between two rails. -->
    <pattern id="p-railing" width="22" height="60" patternUnits="userSpaceOnUse">
      <path d="M11 60V12M0 19h22M0 55h22" stroke="#c9a05a" stroke-width="2"/>
      <path d="M11 2l3.4 9.5H7.6z" fill="#e6c16c"/>
      <circle cx="0" cy="37" r="7" fill="none" stroke="#c9a05a" stroke-width="1.6"/>
      <circle cx="22" cy="37" r="7" fill="none" stroke="#c9a05a" stroke-width="1.6"/>
    </pattern>
    <!-- Pavlovo Posad shawl (Moscow region): a brick rose, gold Khokhloma vines with rowan berries, cobalt daisies. -->
    <g id="shawl-vine">
      <path d="M100 100C84 80 70 94 58 74 50 60 44 44 26 30" fill="none" stroke="#dcab49" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M58 74c-12 2-20-4-22-14 10-2 19 3 22 14zM72 88c2-12 10-18 20-17-1 10-9 17-20 17zM44 48c-11-4-15-12-12-22 10 3 15 12 12 22z" fill="#3f7d46"/>
      <path d="M34 38c-7-8-5-16 3-20" fill="none" stroke="#dcab49" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="47" cy="65" r="3.2" fill="#c0392b"/><circle cx="41.5" cy="70" r="2.6" fill="#c0392b"/><circle cx="51" cy="71.5" r="2.4" fill="#c0392b"/>
    </g>
    <g id="shawl-rose">
      <g fill="#8e2a1f" stroke="#dcab49" stroke-width="1">
        <ellipse cy="-24" rx="11" ry="22"/><ellipse cy="-24" rx="11" ry="22" transform="rotate(45)"/>
        <ellipse cy="-24" rx="11" ry="22" transform="rotate(90)"/><ellipse cy="-24" rx="11" ry="22" transform="rotate(135)"/>
        <ellipse cy="-24" rx="11" ry="22" transform="rotate(180)"/><ellipse cy="-24" rx="11" ry="22" transform="rotate(225)"/>
        <ellipse cy="-24" rx="11" ry="22" transform="rotate(270)"/><ellipse cy="-24" rx="11" ry="22" transform="rotate(315)"/>
      </g>
      <g fill="#c0392b" stroke="#f0cd7c" stroke-width=".8">
        <ellipse cy="-13" rx="6.5" ry="12" transform="rotate(22.5)"/><ellipse cy="-13" rx="6.5" ry="12" transform="rotate(112.5)"/>
        <ellipse cy="-13" rx="6.5" ry="12" transform="rotate(202.5)"/><ellipse cy="-13" rx="6.5" ry="12" transform="rotate(292.5)"/>
      </g>
      <circle r="7" fill="#dcab49"/><circle r="3" fill="#8e2a1f"/>
    </g>
    <g id="shawl-daisy">
      <g fill="#2448b8" stroke="#dcab49" stroke-width=".8">
        <ellipse cy="-15" rx="6.5" ry="14"/><ellipse cy="-15" rx="6.5" ry="14" transform="rotate(60)"/>
        <ellipse cy="-15" rx="6.5" ry="14" transform="rotate(120)"/><ellipse cy="-15" rx="6.5" ry="14" transform="rotate(180)"/>
        <ellipse cy="-15" rx="6.5" ry="14" transform="rotate(240)"/><ellipse cy="-15" rx="6.5" ry="14" transform="rotate(300)"/>
      </g>
      <circle r="5" fill="#f0cd7c"/>
    </g>
    <g id="shawl-bud" fill="#dcab49">
      <ellipse cy="-8" rx="3.6" ry="8"/><ellipse cy="-8" rx="3.6" ry="8" transform="rotate(90)"/>
      <ellipse cy="-8" rx="3.6" ry="8" transform="rotate(180)"/><ellipse cy="-8" rx="3.6" ry="8" transform="rotate(270)"/>
      <circle r="2.6" fill="#c0392b"/>
    </g>
    <pattern id="p-shawl" width="240" height="240" patternUnits="userSpaceOnUse">
      <use href="#shawl-vine"/>
      <use href="#shawl-vine" transform="rotate(90 120 120)"/>
      <use href="#shawl-vine" transform="rotate(180 120 120)"/>
      <use href="#shawl-vine" transform="rotate(270 120 120)"/>
      <use href="#shawl-rose" x="120" y="120"/>
      <use href="#shawl-daisy"/><use href="#shawl-daisy" x="240"/><use href="#shawl-daisy" y="240"/><use href="#shawl-daisy" x="240" y="240"/>
      <use href="#shawl-bud" x="120"/><use href="#shawl-bud" x="120" y="240"/><use href="#shawl-bud" y="120"/><use href="#shawl-bud" x="240" y="120"/>
    </pattern>
    <!-- The cobalt net again, at wall scale: St Petersburg's own porcelain behind the whole page. -->
    <pattern id="p-net" width="84" height="84" patternUnits="userSpaceOnUse">
      <path d="M0 0l84 84M84 0L0 84" stroke="#2448b8" stroke-width="3.2"/>
      <path d="M0 0l84 84M84 0L0 84" stroke="#7d9bf0" stroke-width=".8"/>
      <path id="net-star" d="M42 32.5l2.4 7.1 7.1 2.4-7.1 2.4-2.4 7.1-2.4-7.1-7.1-2.4 7.1-2.4z" fill="#dcab49"/>
      <use href="#net-star" x="-42" y="-42"/><use href="#net-star" x="42" y="-42"/><use href="#net-star" x="-42" y="42"/><use href="#net-star" x="42" y="42"/>
      <g fill="#2448b8"><circle cx="42" cy="12" r="2.2"/><circle cx="42" cy="72" r="2.2"/><circle cx="12" cy="42" r="2.2"/><circle cx="72" cy="42" r="2.2"/></g>
    </pattern>
  </defs>
